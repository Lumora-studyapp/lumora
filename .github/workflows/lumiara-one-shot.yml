name: Apply Lumiara jasmine tree patch

# One-shot implementation for the preview branch.
on:
  push:
    branches:
      - codex/lumiara-jasmine-preview
    paths:
      - .github/workflows/lumiara-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lumiara-jasmine-preview
      - name: Apply deterministic tree patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ascendu/ascendu/src/App.jsx')
          s = p.read_text()
          changes = []
          old = '  { id:"wisteria", name:"Wisteria",       cost:830,  shape:"willow",  trunk:"#5E4A3A", canopy:"#9B7EDE", desc:"Drooping clusters of lilac blossom", collection:"shapes", isNew:true },'
          new = old + '\n  { id:"lumiara", name:"Lumiara", cost:2100, shape:"willow", trunk:"#5B4737", canopy:"#F7F8EE", desc:"A luminous jasmine sanctuary of cascading white blooms", collection:"premium", flagship:true, premiumTheme:"jasmine", isNew:true,\n    enhanceTiers:[\n      { tier:1, name:"Bloom", icon:"✦", blurb:"Slender jasmine branches begin to cascade with delicate white flowers and a soft halo of drifting petals." },\n      { tier:2, name:"Cascade", icon:"❋", blurb:"Longer flowering trails spill from the canopy while white sparkles glimmer between the leaves and petals gather below." },\n      { tier:3, name:"Celestial", icon:"✧", blurb:"The jasmine becomes a radiant hanging canopy with falling blossoms, a carpet of white petals, star-like sparkles and two tiny birds resting among the branches." },\n    ] },'
          if old not in s: raise SystemExit('skin insertion anchor not found')
          s = s.replace(old, new, 1); changes.append('catalogue')
          old = '  wisteria:{width:1.3,height:1.08,gardenGap:.24,tierStep:.05,particleDensity:3},'
          new = old + '\n  lumiara:{width:1.38,height:1.2,visualScale:.98,gardenGap:.26,tierStep:.08,particleDensity:4,effectBounds:1.34,motionIntensity:.34},'
          if old not in s: raise SystemExit('visual profile anchor not found')
          s = s.replace(old, new, 1); changes.append('profile')
          old = '  if(skin.id==="wisteria")                          return { kind:"petal",  color:"#9B7EDE" };'
          new = old + '\n  if(skin.id==="lumiara")                           return { kind:"petal",  color:"#FFFFFF" };'
          if old not in s: raise SystemExit('particle anchor not found')
          s = s.replace(old, new, 1); changes.append('particles')
          old = '''  if(shape==="willow"&&skinId==="wisteria")return <g pointerEvents="none">
    {tier>=1&&[-.68,.66].map(dx=><g key={dx} transform={`translate(${cx+dx*r},${baseY-r*.03})`}>
      {[0,1,2].map(i=><circle key={i} cx={(i-1)*r*.045} cy={-i*r*.035} r={r*.045} fill={i%2?"#C7ADEE":"#A98BDD"}/>) }
    </g>)}
  </g>;'''
          if old not in s: raise SystemExit('willow details anchor not found')
          new = old + '''
  if(shape==="willow"&&skinId==="lumiara")return <g pointerEvents="none">
    {[-.72,-.48,-.2,.12,.42,.7].map((dx,j)=><g key={dx} transform={`translate(${cx+dx*r},${canopyY+r*(.18+((j%3)*.04))})`}>
      <path d={`M0 0 q${r*.06} ${r*(.24+(j%2)*.08)} ${r*(j%2?-.03:.04)} ${r*(.48+(j%3)*.1)}`} fill="none" stroke="#58794A" strokeWidth={sw*.72} strokeLinecap="round" opacity=".82"/>
      {Array.from({length:tier>=2?6:4},(_,i)=><g key={i} transform={`translate(${(i%2?-.045:.05)*r},${r*(.13+i*.095)})`}><circle r={r*.034} fill="#FFFFFF"/><circle cx={r*.018} cy={-r*.01} r={r*.018} fill="#FFF8D7" opacity=".92"/></g>)}
    </g>)}
    {tier>=1&&[-.58,-.26,.18,.56].map((dx,i)=><g key={`spark-${i}`} transform={`translate(${cx+dx*r},${canopyY+r*(.02+(i%2)*.22)})`}><path d={`M0 ${-r*.05} L${r*.018} ${-r*.018} L${r*.055} 0 L${r*.018} ${r*.018} L0 ${r*.055} L${-r*.018} ${r*.018} L${-r*.055} 0 L${-r*.018} ${-r*.018} Z`} fill="#FFFFFF" opacity={tier>=3?.96:.7}/></g>)}
    {tier>=2&&[-.7,-.48,-.25,.05,.31,.58,.76].map((dx,i)=><ellipse key={`ground-${i}`} cx={cx+dx*r} cy={baseY+r*(.055+(i%2)*.025)} rx={r*.045} ry={r*.016} fill="#FFFFFF" opacity=".82" transform={`rotate(${i*23} ${cx+dx*r} ${baseY+r*(.055+(i%2)*.025)})`}/>)}
    {tier>=3&&[-.36,.34].map((dx,i)=><g key={`bird-${i}`} transform={`translate(${cx+dx*r},${canopyY-r*.12})`}><ellipse cx="0" cy="0" rx={r*.07} ry={r*.038} fill="#F4F4F0"/><path d={`M${-r*.04} 0 q${r*.055} ${-r*.075} ${r*.11} 0 q${-r*.055} ${r*.015} ${-r*.11} 0`} fill="#2E3330"/><circle cx={r*.04} cy={-r*.008} r={r*.008} fill="#171A18"/></g>)}
  </g>;'''
          s = s.replace(old, new, 1); changes.append('jasmine renderer')
          p.write_text(s)
          print('Applied:', ', '.join(changes))
          PY
      - name: Commit patched tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascendu/ascendu/src/App.jsx
          git commit -m "feat: add Lumiara jasmine tree skin"
          git push origin HEAD:codex/lumiara-jasmine-preview